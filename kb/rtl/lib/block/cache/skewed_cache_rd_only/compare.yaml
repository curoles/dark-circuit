type: measurement
title: Skewed 2 x 64 lines against set-associative 64 x 2 (LRU), miss rates on synthetic streams
date: 2026-10-29
what: >
  Miss rates of the models of SkewedCacheRdOnly and SetAssocCacheRdOnly, both 128 lines, on
  the same synthetic line-address streams; it decided for the skewed cache (user's idea: the
  testbench models, no complex setup).
result: >
  Verilator, 20000 accesses after a warm-up of 2000, skewed / set-associative:
  random over 64, 128 contiguous lines 0 / 0 %; over 192 lines 33.5 / 33.6 %, 256 lines
  50.4 / 50.3 % (capacity: equal);
  conflict, 3 or 4 lines of one set cycled 0 / 100 %; stride 32 or 64 lines 0 / 100 %; stride
  128 lines 50 / 100 % (f1 uses only SETS_WIDTH bits of the tag: half of way 1's indices);
  loops of 96, 128 lines 0 / 0 %, 160 lines 60 / 60 %; 70 % loop of 80 and 30 % random 41.1 /
  42.4 %;
  working sets at scattered random addresses (4 trials): 32 lines 0 / 0-12.6 %, 64 lines
  0-0.2 / 8.0-15.6 %, 96 lines 0.7-7.6 / 16.6-20.9 %, 128 lines 13.5-17.3 / 26.9-29.0 %; in
  total 13304 / 45762 misses (3.4 times fewer).
  Where conflicts decide, the skewed cache misses several times less, or not at all; where
  only capacity decides, both are equal. Not always: on a shorter run (Icarus) one scattered
  set of 32 lines missed 0.3 % in the skewed cache and never in the set-associative one, so
  the test checks scattered sets in total.
how: >
  make run R=cache_compare V=1 (the test prints the table; Icarus runs fewer accesses, so its
  numbers differ a little).
guarded_by:
  - test/block/cache/skewed_cache_rd_only/tb_cache_compare.sv#must_win
  - test/block/cache/skewed_cache_rd_only/tb_cache_compare.sv#total_s
relies_on:
  - rtl/lib/block/cache/skewed_cache_rd_only/design
