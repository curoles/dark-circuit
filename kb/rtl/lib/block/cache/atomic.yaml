type: decision
title: An atomic passes a cache as a no-cache load that never hits and drops the line it hits
date: 2026-11-07
question: >
  Atomics are done at the point of coherence (kb rtl/lib/block/atomic/design), below the
  library's write-through caches, but their lines may be in a cache: how does a cache carry an
  atomic down, and keep no stale copy of the line it changes?
decision: >
  The request channels of the read-write caches and CacheControl get req_atop and
  mem_req_atop (AtomicPkg's atop_t, AXI5 AWATOP's values). An atomic is a load with an atop:
  taken and looked up like a no-cache request (req_ready does not depend on it), it never
  hits (load_hit and load_miss see look_atomic), goes to memory exactly as asked (address,
  size, its operand in the store's fields, its atop) and is served as a miss whose answer,
  the old value, goes to the CPU and is not written (no victim, no refill). A line it hits is
  dropped in the clock memory takes its read (drop = served AND look_atomic AND hit: the
  cache clears the valid bit of the way that hits, at look_line's index there); no request is
  taken in that clock (a load miss is looked up), so nothing reads the line meanwhile, and the
  next access misses and reads the new value, which the unit below orders after the atomic's
  write (AtomicUnit takes no request until it). Uncached (bypass) requests pass req_atop as
  they come. Read-only caches have no atomics: their wrappers tie req_atop to ATOP_NONE.
why: >
  A write-through cache owns no line, so it cannot do the operation (kb
  rtl/lib/block/atomic/design: not in L1 for Mig3), and it does not see the new value; the
  only copy it may keep is the old one, so it drops it. Dropping when memory takes the read
  costs nothing new: the valid RAM already has a write port (the refill's), the lookup
  already knows the way that hits, and no request can be taken in that clock. Treating the
  atomic as a no-cache request reuses the exact-request path (kb
  rtl/lib/block/cache/uncached), so the address compare stays off req_ready.
rejected:
  - choice: Update the cached line with the new value
    why_not: >
      The cache would need the operation (an ALU per cache, against the decision) or the new
      value back from below (another answer on the channel).
  - choice: Drop the line when the answer comes (the refill clock)
    why_not: >
      A request is taken in that clock and reads the old line (read-first RAMs): a replay
      or forwarding of the valid bit would be needed. When memory takes the read, no request
      is taken.
  - choice: Send atomics through the bypass (req_uncached_dbg_bypass)
    why_not: >
      The bypass is a debug mode whose input reaches req_ready; and it leaves the line in the
      cache, stale.
  - choice: Atomics only on no-cache addresses
    why_not: AMOs on ordinary memory (libc, riscv-tests rv32ua) must work.
relies_on:
  - rtl/lib/block/atomic/design
  - rtl/lib/block/cache/uncached
evidence: >
  2026-11-07: the SkewedCache test sends atomics (one request in 16, to addresses of the pool,
  all nine operations, a word with its strobes); its model expects no hit, the memory
  request as asked with the operand and atop, the old line as the answer, and the line
  invalid after memory takes the atomic (its memory writes the operand's bytes, so a kept
  line would answer stale); atomics that drop a line and that miss must happen. Both
  versions pass on Verilator and Icarus; mutants caught (kb
  test/block/cache/skewed_cache/mutants). DirectCache and SetAssocCache have the same logic;
  their tests pass with ATOP_NONE (their drop is not exercised).
