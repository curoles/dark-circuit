type: pattern
title: The register port, how a device of the library offers its registers
date: 2026-11-05
problem: >
  A device of the library (the PLIC, later a timer, a UART) has registers that software
  reads and writes. The library must not assume a bus (user): the same device serves AXI,
  APB, TileLink or a core's own MMIO.
solution: >
  Plain signals with parameters ADDR_WIDTH and DATA_WIDTH, named as the CPU side of the
  library's caches: req_valid, req_ready (the valid/ready rules of AGENTS.md), req_we (1
  write, 0 read), req_addr (the byte address inside the device: the platform subtracts the
  base), req_wdata, req_wstrb (the bytes written, DATA_WIDTH / 8 bits); rsp_valid and
  rsp_rdata, the answer to a read exactly one clock after the request was taken, from a
  register, with no ready. A write gets no answer. No errors: a read of an address with no
  register returns 0, a write there is ignored. A read with a side effect (a PLIC claim)
  acts when the request is taken, so once per read. req_ready from flops only, as the
  caches'. A bus connects through an adapter block of its own (a write response, errors by
  address range, other widths are the adapter's).
why: >
  The caches and Mig3's data channel already use these signals: one convention for every
  request/answer channel of the library, and a core's data port reaches a device with no
  conversion. Parameters, not a package with fixed widths, keep it free of a bus. PULP's
  register_interface is the closest relative (the same request fields and a response with
  ready); it adds an error response, which our pattern leaves to an adapter.
known_as: [register interface, CSR bus, register slave port, APB-like port,
           register bus (PULP REG_BUS), register interface adapter (OpenTitan
           tlul_adapter_reg), CPU interface / cpuif (PeakRDL-regblock)]
rejected:
  - choice: A package of structs with fixed widths (32-bit address and data)
    why_not: Fixed widths are a bus's choice; the library must not make it.
  - choice: Structs generated by macros (as the NoC's flits)
    why_not: >
      More compact ports, but the caches' plain signals are the convention for this kind of
      channel already.
  - choice: An answer for writes, error answers
    why_not: The caches and Mig3's channel have none; an adapter makes them when its bus wants.
relies_on:
  - rtl/lib/block/plic/design
code:
  - rtl/lib/block/plic/plic_pkg.sv
