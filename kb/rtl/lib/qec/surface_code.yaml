type: decision
title: QecPkg, the rotated surface code of distance d as functions, shared by every QEC block
date: 2026-11-13
question: >
  The QEC detour (the user: a small detour, a couple of RTL blocks, no software packages
  unless needed) decodes surface-code syndromes. Which code and which layout, where do QEC
  blocks live, and how do blocks and tests agree on which stabilizer touches which data
  qubit?
decision: >
  The rotated surface code (d x d data qubits, (d^2 - 1) / 2 stabilizers of each type), in
  rtl/lib/qec/qec_pkg.sv, package QecPkg: functions of d, no fixed size, so a block takes D
  as a parameter and computes its constants. Data qubit (r, c), index r * d + c;
  stabilizers at plaquettes (i, j), 0 to d, touching the existing data qubits of (i-1..i,
  j-1..j); a checkerboard inside (X-type where i + j is even), every other plaquette on the
  edge, X-type at the top and bottom, Z-type at the left and right, none at the corners;
  each type numbered in raster order. Functions: data_qubits, stabs, is_stab, stab_row,
  stab_col, touches. The terms of the header follow J. Roffe, Quantum Error Correction: An
  Introductory Guide (arXiv:1907.11157), as the user asked. QEC-specific blocks live in
  rtl/lib/qec/<block> (a domain folder as rtl/lib/ai, the user's choice), generic ones in
  rtl/lib/block (PrefixCount, StreamCompact).
why: >
  The surface code is the standard code of superconducting qubits (nearest neighbours on a
  grid, a high threshold) and its decoding graph is a regular grid, which suits hardware.
  The rotated layout needs d^2 data qubits for distance d. Functions of d instead of tables
  let blocks, testbenches and synthesis use any odd d. The test checks
  what makes the layout a code: X-type and Z-type stabilizers share an even number of data
  qubits (they commute), every data qubit is watched by each type, and the logical
  operators (a column of X errors, a row of Z errors) are unseen, d errors.
rejected:
  - choice: The unrotated surface code
    why_not: About twice the data qubits for the same distance (d^2 + (d - 1)^2 against d^2).
  - choice: Tables generated by a script (Stim's coordinates)
    why_not: >
      A script and a dependency (no packages unless needed); the functions are short and
      their test checks the code's properties directly.
  - choice: A stab_place returning {i, j}, an early return in its loop
    why_not: >
      Icarus 13 crashes on it (and on an enum's .name()); stab_row and stab_col keep the
      result and return it at the end.
evidence: >
  2026-11-13: qec_pkg passes on Verilator (d = 3, 5, 7, 9; 0.1 s) and Icarus (d up to 7;
  1.6 s): count, weight, watched, commute and logical for both types.
code:
  - rtl/lib/qec/qec_pkg.sv#is_stab
  - rtl/lib/qec/qec_pkg.sv#touches
