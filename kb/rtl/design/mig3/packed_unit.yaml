type: decision
title: Mig3's packed instructions are KIND_PACKED, done in one EX cycle by Mig3Packed
date: 2026-11-11
question: >
  The first P instructions (PADD.B, PADD.H, PSUB.B, PSUB.H; kb rtl/design/mig3/p_profile):
  where do their encodings come from, how does decode hand them to EX, which unit computes
  them and in how many cycles, how does the interlock see their registers, and how are they
  assembled?
decision: >
  RiscvInstrPkg is generated with riscv-opcodes' unratified/rv_p and unratified/rv32_p
  (the generator takes unratified tables only with that prefix): 564 encodings, the earlier
  names unchanged. Decode: KIND_PACKED, rd from RD_PACKED (rd_src_e grows to 4 bits), rs1
  and rs2 read, the operation in pk_ctrl_t (sub, lane: PackedPkg::lane_e) by the
  encodings. EX: Mig3Packed, PackedAdd on rs1 and rs2, combinational: one cycle, its result
  in EX's rd mux and forwarded like the ALU's. The interlock's opcode rule (kb
  rtl/design/mig3/interlock_by_opcode) reads rs1 and rs2 for OP-32, P's opcode. Tests are
  assembled by clang's experimental P (cmake/riscv.cmake: DARK_CIRCUIT_RISCV_P, the march
  part DC_RISCV_P_MARCH = _p0p21 and DC_RISCV_P_FLAGS = -menable-experimental-extensions);
  gcc 12.2 has no P and the tests are not added. The saturating forms (PSADD, PSADDU,
  PSSUB, PSSUBU): pk_ctrl_t's sat and is_unsigned; Mig3Packed puts PackedSaturate after
  PackedAdd (kb rtl/lib/numeric/packed/saturate) and picks its result by sat; sat with
  some lane clamped is Mig3Csr's vxsat_set, applied when the instruction completes. The
  minimum and maximum (PMIN, PMINU, PMAX, PMAXU): pk_ctrl_t's minmax and max, sub set by
  decode; PackedMinMax (kb rtl/lib/numeric/packed/min_max) on the same PackedAdd's
  carries. The shifts (PSLL, PSRL, PSRA by rs2[4:0], PSLLI, PSRLI, PSRAI by an immediate,
  its low 3 or 4 bits by the lane): PackedShift (kb rtl/lib/numeric/packed/shift) on rs1;
  OP-IMM-32 joins the interlock rule's rs1-and-rs2 row (the register forms read rs2, the
  immediate forms claim it). pk_ctrl_t's op (PK_ADD, PK_SAT, PK_MIN_MAX, PK_SHIFT) picks
  the result; it replaced the sat and minmax bits with the shifts, which keeps pk_of's
  table, one row per instruction, within 100 columns.
why: >
  A kind and a control struct of its own is how every unit of Mig3 gets its instructions
  (decode classifies once, the unit decodes nothing). PackedAdd is the ALU's adder with lane
  cuts (1.5 ns against 1.3 ns alone, kb rtl/lib/numeric/packed/design): it fits EX's one
  cycle; the timing rule of the profile checks the rd mux it widens. OP-32 is RV64's
  opcode, free on RV32, which P reuses: without its row the rule would miss rs2.
rejected:
  - choice: The packed add/sub inside Alu2
    why_not: >
      Alu2 is the scalar ALU of Mig2 and Mig3; lanes, carries for saturation and later
      packed operations belong to the packed family and a unit of their own.
  - choice: P instructions assembled with .insn and numbers
    why_not: >
      Encodings typed by hand in tests; clang knows the draft and gives riscv-opcodes'
      encodings.
relies_on:
  - rtl/design/mig3/p_profile
  - rtl/design/mig3/interlock_by_opcode
  - rtl/lib/numeric/packed/design
code:
  - rtl/design/mig3/mig3_packed.sv
  - rtl/design/mig3/mig3_decode.sv#pk_of
  - test/design/mig3/pk_add.S
evidence: >
  2026-11-11, Verilator, clang-23.1.6: the Mig3 suite passes (139 tests), with pk_add (every
  lane wrapping alone, a result forwarded at once, rs2 loaded right before PADD.B) and the
  decode test's four P cases against its pk_model. clang encodes PADD.B as riscv-opcodes
  does (0x84c5853b for a0, a1, a2); with P enabled it assembles li of a constant with equal
  halfwords as PLI.H, so pk_add builds it with LUI and ADDI. sky130 (Yosys, ABC): Mig3Core
  5.4 ns, the longest path the rs3 read (ID/EX register into Mig3Fpu's rs3_data) as before,
  no packed logic on it; 415 360 um2 (413 011 at the interlock by opcode). The saturating
  forms (2026-11-11): the Mig3 suite passes (140 tests), with pk_sat (every saturating
  instruction clamping some lane and setting vxsat, read by the next instruction; no
  vxsat from PADD's wrapping overflow nor from lanes that reach a limit exactly; vxsat
  sticky; a saturated result forwarded at once) and eight more decode cases; sky130 5.3
  ns, the longest path into Mig3Fpu's FMA (ID/EX register into the addend's CSA), no
  packed logic on it; 415 086 um2 (ABC's spread is larger than PackedSaturate's 800).
  The minimum and maximum (2026-11-11): the Mig3 suite passes (141 tests), with
  pk_min_max (operands that make all eight results differ, equal lanes, a ReLU forwarded
  into a clamp, no vxsat) and eight more decode cases; sky130 5.4 ns, the longest path in
  the caches (the D-cache's line register into the memory arbiter's address), no packed
  logic on it; 415 964 um2. The shifts (2026-11-11): the Mig3 suite passes (142 tests),
  with pk_shift (all six immediate forms; by rs2 amounts 3, 9, 31 and 0x103 of which only
  rs2[4:0] counts; rs2 loaded right before the shift; a result forwarded at once) and
  twelve more decode cases; sky130 5.5 ns, 420 740 um2, the longest path from the ID/EX
  register through EX's result and its forwarding into ID (id_rs1_data). The same run
  with the packed unit's result tied to 0: 5.4 ns, the same end point (the core's own
  EX-to-ID forwarding path), 414 198 um2. Within ABC's spread, but the packed results now
  reach the top path's level: further one-cycle packed operations need the result register
  of the profile's fallback, or a cut in that path.
