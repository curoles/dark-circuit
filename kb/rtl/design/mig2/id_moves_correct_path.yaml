type: invariant
title: An instruction that leaves ID is on the correct path, and it leaves ID once
date: 2026-10-24
statement: >
  When id_moves=1, the instruction in ID goes to EX at the rising edge, and it completes (it
  retires, or traps). It is never an instruction of a wrong path, and id_moves is 1 for it in
  exactly one clock, also when it waits in ID first (load-use, a division in EX).
why: >
  The commit point of Mig2 is EX: an instruction that leaves EX always completes. So the only
  older instruction that can still redirect fetch is the one in EX, and it decides in the
  same clock in which the instruction in ID would move; when it redirects (or halts),
  flush_id=1 and id_moves=0, and the instruction in ID is dropped. ex_stall and id_hazard
  keep it in ID until it moves. So ID actions that must not happen on a wrong path or twice
  use id_moves: the redirect from ID, the invalidate of a wrong BTB entry, and the push and
  pop of the return-address stack, which therefore never needs repair after a misprediction.
evidence: >
  a_id_moves_ex checks that an instruction that leaves ID is in EX at the next edge (an
  instruction in EX always completes or traps); a_id_redirect_moves checks that ID
  redirects only for an instruction that moves.
