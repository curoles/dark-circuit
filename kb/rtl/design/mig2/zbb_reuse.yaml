  - rtl/design/mig2/mig2_alu.sv#pick_a
  - rtl/design/mig2/mig2_decode.sv#logic_inv
  - test/design/mig2/CMakeLists.txt#rv32uzbb
  - test/design/mig2/tb/tb_mig2_alu.sv#alt_op
  - tools/riscv_opcodes.sh
