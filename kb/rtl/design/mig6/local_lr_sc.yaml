type: decision
title: LR/SC on a Mig6 PE's local memory are decided by an exclusive monitor at its port
date: 2026-11-20
question: >
  The core's own reservation (Mig6Atomic) served LR/SC on the local memory while the core
  was its only writer. A PE's DMA writes the local memory now (kb rtl/design/mig6/dma), and
  the core's reservation does not see it: an SC after a DMA write to the reserved word
  would succeed when it must fail. Interrupt handlers are coming too (kb
  rtl/design/mig6/plic). How are local LR/SC kept right?
decision: >
  The same rule as the shared memory (kb rtl/design/mig6/far_lr_sc), user's choice (a),
  2026-11-20: LR/SC are decided where every write to the memory passes. Mig6Lsu makes every
  LR or SC to a reservable region an exclusive request (far = LR or SC and reservable); a
  local one goes on the scratchpad port with excl (Mig6Caches: an SC wants an answer).
  Mig6Pe carries excl through the local memory's ReqMux and puts the library's
  ExclusiveMonitor (one agent, the core) between the ReqMux and the RAM: an LR reserves its
  line; every write the RAM takes ends the reservation of its line (the DMA's, the core's
  own, an interrupt handler's); an SC is decided when the RAM would take it, writes only
  with the reservation, and is answered with its status (0 stored, 1 failed) in the clock
  after, where a read's answer comes (a_sc_alone). A reservation is a line of the local
  memory, the RAM's request (RESV_OFFSET = LINE_START). The core's reservation is never
  taken any more, so Mig6Atomic went right after (the same day): no reservation in the
  core, no cancelled store; an SC's rd_src is RD_LOAD, its status coming back as loaded
  data; a_lr_sc_reservable moved to Mig6Core (an LR or SC that is not exclusive).
why: >
  One mechanism for every memory, right for any number of writers (the engine later too),
  with a block the library already has and tests; the core gets simpler, not a snoop port
  for each new writer. A local SC becomes answered, like a load, at one clock. The spec
  allows a reservation set larger than the word, and the line is what the RAM's request
  carries: a store to the line's other word also ends it, which a constrained LR/SC loop
  (no other store between its LR and its SC) never meets.
rejected:
  - choice: Keep the core's reservation and feed it the other writers' addresses (a snoop)
    why_not: A port into the core for every future writer, and two LR/SC mechanisms in one
      machine; "fast in the core for now" against the scale-to-future-Migs rule.
  - choice: A word reservation at the local memory
    why_not: The word index would have to travel with every request through the ReqMux; a
      line costs nothing and the spec allows it.
relies_on:
  - rtl/design/mig6/far_lr_sc
  - rtl/design/mig6/scratchpad
  - rtl/design/mig6/dma
  - rtl/lib/block/atomic/exclusive_monitor/design
evidence: >
  2026-11-20, Verilator, test design_mig6_lrsc_local on every PE at once, five cases
  between an lr.w and an sc.w of a word alone in its line: nothing, the SC stores; the DMA
  writes the word, the SC fails and the DMA's value stays; the DMA writes another line, the
  SC stores; the hart's own store to the word, the SC fails; an interrupt (the DMA's done)
  whose handler stores to the word, the SC fails. cas_check's local CAS passes through the
  monitor. A negative probe (the monitor ignoring every write): case 2's SC stores, the
  test fails. Every Mig6 test passes (20). With Mig6Atomic removed every Mig6 program
  prints the same, cycles included (14 programs, before and after).
code:
  - rtl/design/mig6/mig6_pe.sv#u_local_monitor
  - rtl/design/mig6/mig6_lsu.sv#excl
  - rtl/design/mig6/mig6_caches.sv#lmem_req
  - test/design/mig6/lrsc_local.cpp
