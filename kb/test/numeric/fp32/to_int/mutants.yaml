type: mutants
title: Mutants of Fp32ToInt (TestFloat's f32_to_i32, f32_to_ui32)
date: 2026-11-09
tests: [numeric_fp32_to_int]
mutants:
  - name: -2^31 is out of range for a signed result
    edits:
      - file: rtl/lib/numeric/fp32/to_int/hybrid/fp32_to_int.sv
        old: "? !int_part[31] || (low_zero && !inc)"
        new: "? !int_part[31] || (low_zero && !inc && 1'b0)"
    expect: caught
  - name: a negative value that rounds to 0 is invalid unsigned
    edits:
      - file: rtl/lib/numeric/fp32/to_int/hybrid/fp32_to_int.sv
        old: "? !int_part[31] && low_zero && !inc"
        new: "? !int_part[31] && low_zero && !inc && 1'b0"
    expect: caught
  - name: a value below 2^-27 is not inexact
    edits:
      - file: rtl/lib/numeric/fp32/to_int/hybrid/fp32_to_int.sv
        old: "assign sticky   = |field[W-34:0] || (tiny && !u.zero);"
        new: "assign sticky   = |field[W-34:0] || (tiny && !u.zero && 1'b0);"
    expect: caught
  - name: TOINT_ARM gives RISC-V's integer for a NaN
    edits:
      - file: rtl/lib/numeric/fp32/to_int/hybrid/fp32_to_int.sv
        old: "assign inv_value = u.nan ? '0 : !u.sign ? {!is_signed, 31'h7fff_ffff}"
        new: >-
          assign inv_value = u.nan ? {!is_signed, 31'h7fff_ffff} :
          !u.sign ? {!is_signed, 31'h7fff_ffff}
    expect: caught
  - name: a negative result rounded up in magnitude takes the carry in of the others
    edits:
      - file: rtl/lib/numeric/fp32/to_int/hybrid/fp32_to_int.sv
        old: "assign cin = inc ^ neg;"
        new: "assign cin = inc | neg;"
    expect: caught
  - name: 2^31 - 1 rounded up stays in range for a signed result
    edits:
      - file: rtl/lib/numeric/fp32/to_int/hybrid/fp32_to_int.sv
        old: ": !int_part[31] && !(low_ones && inc);"
        new: ": !int_part[31] && !(low_ones && inc && 1'b0);"
    expect: survives
    why: >
      No fp32 has the integer part 2^31 - 1 (or 2^32 - 1): from 2^24 on fp32 values are
      integers with at most 24 significant bits, so rounding up never crosses those
      limits. The terms stay: the range check is right for any integer, not by luck.
