type: mutants
title: Mutants of the ReqMux test (behave and struct versions)
date: 2026-11-09
tests: [block_req_mux_behave, block_req_mux_struct]
mutants:
  - name: behave, no lock of the grant while an offer waits
    tests: [block_req_mux_behave]
    edits:
      - file: rtl/lib/block/req_mux/behave/req_mux.sv
        old: "assign grant      = lock ? lock_grant : pick(req_valid, last);"
        new: "assign grant      = (lock & 1'b0) ? lock_grant : pick(req_valid, last);"
  - name: behave, a request that wants an answer taken while the owners' FIFO is full
    tests: [block_req_mux_behave]
    edits:
      - file: rtl/lib/block/req_mux/behave/req_mux.sv
        old: "!(full && win_ask);"
        new: "!(full && win_ask && 1'b0);"
  - name: struct, the wrong requester's number in the FIFO
    tests: [block_req_mux_struct]
    edits:
      - file: rtl/lib/block/req_mux/struct/req_mux.sv
        old: ".write(ask_taken), .data_in(grant),"
        new: ".write(ask_taken), .data_in(grant ^ N'(1)),"
  - name: struct, posted writes counted as answers waiting
    tests: [block_req_mux_struct]
    edits:
      - file: rtl/lib/block/req_mux/struct/req_mux.sv
        old: ".in1(tgt_take), .in2(win_ask), .out(ask_taken)"
        new: ".in1(tgt_take), .in2(1'b1), .out(ask_taken)"
  - name: behave, a write that wants an answer counted as posted (2026-11-18)
    tests: [block_req_mux_behave]
    edits:
      - file: rtl/lib/block/req_mux/behave/req_mux.sv
        old: "assign win_ask    = (grant & req_rsp) != '0;"
        new: "assign win_ask    = (grant & req_rsp & ~req_we) != '0;"
