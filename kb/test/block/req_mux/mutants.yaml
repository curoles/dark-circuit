type: mutants
title: Mutants of the ReqMux test (behave and struct versions)
date: 2026-11-09
tests: [block_req_mux_behave, block_req_mux_struct]
mutants:
  - name: behave, no lock of the grant while an offer waits
    tests: [block_req_mux_behave]
    edits:
      - file: rtl/lib/block/req_mux/behave/req_mux.sv
        old: "assign grant      = lock ? lock_grant : order;"
        new: "assign grant      = (lock & 1'b0) ? lock_grant : order;"
  - name: behave, a request that wants an answer taken while the owners' FIFO is full
    tests: [block_req_mux_behave]
    edits:
      - file: rtl/lib/block/req_mux/behave/req_mux.sv
        old: "!(full && win_ask);"
        new: "!(full && win_ask && 1'b0);"
  - name: struct, the wrong requester's number in the FIFO
    tests: [block_req_mux_struct]
    edits:
      - file: rtl/lib/block/req_mux/struct/req_mux.sv
        old: ".write(ask_taken), .data_in({grant, win_len}),"
        new: ".write(ask_taken), .data_in({grant ^ N'(1), win_len}),"
  - name: struct, posted writes counted as answers waiting
    tests: [block_req_mux_struct]
    edits:
      - file: rtl/lib/block/req_mux/struct/req_mux.sv
        old: ".in1(tgt_take), .in2(win_ask), .out(ask_taken)"
        new: ".in1(tgt_take), .in2(1'b1), .out(ask_taken)"
  - name: behave, a write that wants an answer counted as posted (2026-11-18)
    tests: [block_req_mux_behave]
    edits:
      - file: rtl/lib/block/req_mux/behave/req_mux.sv
        old: "assign win_ask    = (grant & req_rsp) != '0;"
        new: "assign win_ask    = (grant & req_rsp & ~req_we) != '0;"
  - name: behave, fixed priority picks the highest requester (2026-11-19)
    tests: [block_req_mux_behave]
    edits:
      - file: rtl/lib/block/req_mux/behave/req_mux.sv
        old: "for (int i = N - 1; i >= 0; i--)"
        new: "for (int i = 0; i < N; i++)"
  - name: struct, fixed priority ignores the lower requesters (2026-11-19)
    tests: [block_req_mux_struct]
    edits:
      - file: rtl/lib/block/req_mux/struct/req_mux.sv
        old: ".in(arb_req[i-1:0]), .out(below)"
        new: ".in(arb_req[i-1:0] & '0), .out(below)"
  - name: behave, a burst's owner leaves at every answer (2026-11-20)
    tests: [block_req_mux_behave]
    edits:
      - file: rtl/lib/block/req_mux/behave/req_mux.sv
        old: "assign last_beat = beat == owner_len[0];"
        new: "assign last_beat = (beat == owner_len[0]) || tgt_rsp_valid;"
  - name: struct, the beat count never reaches the burst's end (2026-11-20)
    tests: [block_req_mux_struct]
    edits:
      - file: rtl/lib/block/req_mux/struct/req_mux.sv
        old: ".in1(beat), .in2(old_len), .eq(last)"
        new: ".in1(beat), .in2(old_len ^ LEN_WIDTH'(1)), .eq(last)"
