type: mutants
title: Mutants of the PlicClaim test (behave and struct versions)
date: 2026-11-05
tests: [block_plic_claim_behave, block_plic_claim_struct]
mutants:
  - name: behave, a complete counts without its enable
    edits:
      - file: rtl/lib/block/plic/plic_claim/behave/plic_claim.sv
        old: "if (co_en[c] && int'(co_id[c]) == k && row[k])"
        new: "if (co_en[c] && int'(co_id[c]) == k && (row[k] || co_en[c]))"
    expect: model
  - name: behave, only the first context claims
    edits:
      - file: rtl/lib/block/plic/plic_claim/behave/plic_claim.sv
        old: "if (cl_en[c] && int'(cl_id[c]) == k)"
        new: "if (cl_en[c] && int'(cl_id[c]) == k && (c == 0 || cl_en[0]))"
    expect: model
  - name: struct, the complete decoder takes the claim enable
    edits:
      - file: rtl/lib/block/plic/plic_claim/struct/plic_claim.sv
        old: ".in(complete_id[c]), .en(complete_en[c]), .out(complete_dec[c]));"
        new: ".in(complete_id[c]), .en(claim_en[c] | complete_en[c]), .out(complete_dec[c]));"
    expect: model
  - name: struct, the complete is not masked (enable inverted)
    edits:
      - file: rtl/lib/block/plic/plic_claim/struct/plic_claim.sv
        old: "And2 #(1) u_and2(.in1(complete_dec[c][k]), .in2(ie[c][k]), .out(completes[c]));"
        new: "Ind2 #(1) u_and2(.in1(complete_dec[c][k]), .in2(ie[c][k]), .out(completes[c]));"
    expect: model
  - name: struct, claim of source k takes the next ID
    edits:
      - file: rtl/lib/block/plic/plic_claim/struct/plic_claim.sv
        old: "assign claims[c] = claim_dec[c][k];"
        new: "assign claims[c] = claim_dec[c][(k == N_SOURCES) ? k : k + 1];"
    expect: model
