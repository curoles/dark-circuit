type: mutants
title: Mutants of the PlicPkg test (the register map)
date: 2026-11-05
tests: [block_plic_pkg]
mutants:
  - name: one word of bits too few (IDs 0 to n need n / 32 + 1)
    edits:
      - file: rtl/lib/block/plic/plic_pkg.sv
        old: "return n_sources / 32 + 1;"
        new: "return (n_sources + 31) / 32;"
    expect: model
  - name: the enable stride of a context wrong
    edits:
      - file: rtl/lib/block/plic/plic_pkg.sv
        old: "localparam int ENABLE_STRIDE  = 'h80;"
        new: "localparam int ENABLE_STRIDE  = 'h100;"
    expect: model
  - name: source 0's priority is a register
    edits:
      - file: rtl/lib/block/plic/plic_pkg.sv
        old: "if (off / 4 >= 1 && off / 4 <= n_sources) begin"
        new: "if (off / 4 >= 0 && off / 4 <= n_sources) begin"
    expect: model
