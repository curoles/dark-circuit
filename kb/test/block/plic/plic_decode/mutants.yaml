type: mutants
title: Mutants of the PlicDecode test (behave and struct versions)
date: 2026-11-05
tests: [block_plic_decode_behave, block_plic_decode_struct]
mutants:
  - name: behave, the threshold is selected by the claim register
    edits:
      - file: rtl/lib/block/plic/plic_decode/behave/plic_decode.sv
        old: "r.kind == PlicPkg::REG_THRESHOLD"
        new: "r.kind == PlicPkg::REG_CLAIM"
    expect: model
  - name: behave, an enable word is selected for every context
    edits:
      - file: rtl/lib/block/plic/plic_decode/behave/plic_decode.sv
        old: "r.kind == PlicPkg::REG_ENABLE && int'(r.ctx) == c &&"
        new: "r.kind == PlicPkg::REG_ENABLE && int'(r.ctx) >= 0 &&"
    expect: model
  - name: struct, the word numbers are one off
    edits:
      - file: rtl/lib/block/plic/plic_decode/struct/plic_decode.sv
        old: ".in2((BB - 2)'(i))"
        new: ".in2((BB - 2)'(i + 1))"
    expect: model
  - name: struct, the enable block of context c is the one of c + 1
    edits:
      - file: rtl/lib/block/plic/plic_decode/struct/plic_decode.sv
        old: "PlicPkg::ENABLE_STRIDE * c) >> EB"
        new: "PlicPkg::ENABLE_STRIDE * (c + 1)) >> EB"
    expect: model
  - name: struct, the claim is selected at the threshold's word
    edits:
      - file: rtl/lib/block/plic/plic_decode/struct/plic_decode.sv
        old: "word_is[PlicPkg::CLAIM_COMPLETE / 4]"
        new: "word_is[PlicPkg::THRESHOLD / 4]"
    expect: model
