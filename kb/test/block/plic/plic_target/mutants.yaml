type: mutants
title: Mutants of the PlicTarget test (behave and struct versions)
date: 2026-11-05
tests: [block_plic_target_behave, block_plic_target_struct]
mutants:
  - name: behave, priority 0 is eligible
    edits:
      - file: rtl/lib/block/plic/plic_target/behave/plic_target.sv
        old: "el[k] = p[k] && e[k] && pr[k] != '0;"
        new: "el[k] = p[k] && e[k] && (pr[k] != '0 || p[k]);"
    expect: model
  - name: behave, the claim ID is gated by the threshold
    edits:
      - file: rtl/lib/block/plic/plic_target/behave/plic_target.sv
        old: "claim_id <= best_id;"
        new: "claim_id <= (best_prio > threshold) ? best_id : '0;"
    expect: model
  - name: struct, the enable is ignored (ip | ie)
    edits:
      - file: rtl/lib/block/plic/plic_target/struct/plic_target.sv
        old: ".in2(ie[k]), .in3(prio_set)"
        new: ".in2(ip[k] | ie[k]), .in3(prio_set)"
    expect: model
  - name: struct, eip at the threshold too (>=)
    edits:
      - file: rtl/lib/block/plic/plic_target/struct/plic_target.sv
        old: ".in1(best_prio), .in2(threshold_n), .ci(1'b0), .co(above), .sum(diff));"
        new: ".in1(best_prio), .in2(threshold_n), .ci(1'b1), .co(above), .sum(diff));"
    expect: model
  - name: struct, a priority is not 0 only when all its bits are set (AndReduce)
    edits:
      - file: rtl/lib/block/plic/plic_target/struct/plic_target.sv
        old: "OrReduce #(PRIO_WIDTH) u_or_reduce(.in(prio[k]), .out(prio_set));"
        new: "AndReduce #(PRIO_WIDTH) u_or_reduce(.in(prio[k]), .out(prio_set));"
    expect: model
