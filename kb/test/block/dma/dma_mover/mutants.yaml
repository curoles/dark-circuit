type: mutants
title: Mutants of the DmaMover test (behave and struct versions); n is DmaChannel's
  (kb rtl/lib/block/dma/byte_count), its mutants in test/block/dma/dma_engine
date: 2026-11-09
tests: [block_dma_mover_behave, block_dma_mover_struct]
mutants:
  - name: behave, the rotation the wrong way (2026-11-20, the pipelined mover)
    edits:
      - file: rtl/lib/block/dma/dma_mover/behave/dma_mover.sv
        old: "assign cmd_x.rot     = cmd_dst[OFF_WIDTH-1:0] - cmd_src[OFF_WIDTH-1:0];"
        new: "assign cmd_x.rot     = cmd_src[OFF_WIDTH-1:0] - cmd_dst[OFF_WIDTH-1:0];"
    expect: model
  - name: behave, with WR_ACK a transaction retires at its write's take (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_mover/behave/dma_mover.sv
        old: "        assign retire   = wr_rsp_valid && r_head[RW-1];"
        new: "        assign retire   = wr_take && wlast && (r_head[RW-1] || 1'b1);"
    expect: model
  - name: behave, a read's answer written before its data is there (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_mover/behave/dma_mover.sv
        old: "    assign wr_req_valid = !d_empty;"
        new: "    assign wr_req_valid = !d_empty || !a_empty;"
    expect: a_answer_expected
  - name: struct, the data not rotated (2026-11-20, rotated at the write)
    edits:
      - file: rtl/lib/block/dma/dma_mover/struct/dma_mover.sv
        old: ".shift({h_rot, 3'b000})"
        new: ".shift({h_rot & '0, 3'b000})"
    expect: model
  - name: struct, the count in flight never goes down (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_mover/struct/dma_mover.sv
        old: ".in1(take), .in2(retire), .out(count_en)"
        new: ".in1(take), .in2(1'b0), .out(count_en)"
    expect: model
  - name: behave, a burst's beats all written to its first beat (2026-11-20, read bursts)
    edits:
      - file: rtl/lib/block/dma/dma_mover/behave/dma_mover.sv
        old: "assign wr_req_addr  = {head.dst + HW'(wbeat), {OFF_WIDTH{1'b0}}};"
        new: "assign wr_req_addr  = {head.dst, {OFF_WIDTH{1'b0}}};"
    expect: model
  - name: behave, a burst one beat too long (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_mover/behave/dma_mover.sv
        old: "assign rd_req_len   = LW'(n_m1 >> OFF_WIDTH);"
        new: "assign rd_req_len   = LW'(cmd_n >> OFF_WIDTH);"
    expect: model
  - name: struct, a transaction leaves A after its first beat (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_mover/struct/dma_mover.sv
        old: ".in1(wbeat), .in2(h_len), .eq(wlast)"
        new: ".in1(wbeat), .in2(h_len & '0), .eq(wlast)"
    expect: a_answer_expected
  - name: struct, the bytes left one beat short (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_mover/struct/dma_mover.sv
        old: ".in2((BB+1)'({1'b1, wbeat_n})), .ci(1'b1)"
        new: ".in2((BB+1)'({1'b1, wbeat_n})), .ci(1'b0)"
    expect: model
