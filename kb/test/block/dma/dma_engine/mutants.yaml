type: mutants
title: Mutants of the DmaEngine test (DmaChannel behave and struct, DmaEngine)
date: 2026-11-09
tests: [block_dma_engine_behave, block_dma_engine_struct]
mutants:
  - name: DmaChannel behave, a stop is forgotten unless it comes with a done
    tests: [block_dma_engine_behave]
    edits:
      - file: rtl/lib/block/dma/dma_channel/behave/dma_channel.sv
        old: "stopping <= 1'b1;"
        new: "stopping <= 1'b0;"
  - name: DmaChannel behave, the destination advances one byte too far
    tests: [block_dma_engine_behave]
    edits:
      - file: rtl/lib/block/dma/dma_channel/behave/dma_channel.sv
        old: "cur_dst <= cur_dst + ADDR_WIDTH'(mv_n);"
        new: "cur_dst <= cur_dst + ADDR_WIDTH'(mv_n) + 1'b1;"
  - name: DmaChannel struct, the last bytes never seen (the transfer does not end)
    tests: [block_dma_engine_struct]
    edits:
      - file: rtl/lib/block/dma/dma_channel/struct/dma_channel.sv
        old: ".in1(left), .in2(mv_len), .eq(last)"
        new: ".in1(left), .in2(~mv_len), .eq(last)"
  - name: DmaChannel struct, a start of 0 bytes taken as a transfer
    tests: [block_dma_engine_struct]
    edits:
      - file: rtl/lib/block/dma/dma_channel/struct/dma_channel.sv
        old: ".in(start_len), .out(len_zero)"
        new: ".in(start_len | LEN_WIDTH'(1)), .out(len_zero)"
  - name: DmaEngine, no lock of the grant while an offer waits
    edits:
      - file: rtl/lib/block/dma/dma_engine/dma_engine.sv
        old: ".in0(req), .in1(grant_q), .sel(lock)"
        new: ".in0(req), .in1(grant_q), .sel(lock & 1'b0)"
  - name: DmaEngine, the done to the wrong channel
    edits:
      - file: rtl/lib/block/dma/dma_engine/dma_engine.sv
        old: ".in(done_id), .en(done_valid)"
        new: ".in(done_id ^ ID_WIDTH'(1)), .en(done_valid)"
  - name: DmaChannel behave, a stop withdraws an offer (2026-11-20, the issue pointer)
    edits:
      - file: rtl/lib/block/dma/dma_channel/behave/dma_channel.sv
        old: "assign cmd_valid = busy && iss_left != '0 && (!stopping || offered);"
        new: "assign cmd_valid = busy && iss_left != '0 && (!stopping || (offered & 1'b0));"
  - name: DmaChannel struct, a stop ends the transfer with transactions in flight (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_channel/struct/dma_channel.sv
        old: ".in1(stop_any), .in2(drained), .in3(offered_next_n), .out(stopped)"
        new: ".in1(stop_any), .in2(drained | 1'b1), .in3(offered_next_n), .out(stopped)"
  - name: DmaChannel behave, the issue pointer's destination one byte too far (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_channel/behave/dma_channel.sv
        old: "iss_dst  <= iss_dst + ADDR_WIDTH'(n);"
        new: "iss_dst  <= iss_dst + ADDR_WIDTH'(n) + 1;"
  - name: DmaChannel behave, the room one byte short (2026-11-20, n moved from DmaMover)
    edits:
      - file: rtl/lib/block/dma/dma_channel/behave/dma_channel.sv
        old: "room = N_WIDTH'(1 << OFF_WIDTH) - N_WIDTH'((so > d_o) ? so : d_o);"
        new: "room = N_WIDTH'((1 << OFF_WIDTH) - 1) - N_WIDTH'((so > d_o) ? so : d_o);"
  - name: DmaChannel struct, n the larger of the bytes left and the room (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_channel/struct/dma_channel.sv
        old: ".in0(iss_left[N_WIDTH-1:0]), .in1(room), .sel(rest_ge)"
        new: ".in0(room), .in1(iss_left[N_WIDTH-1:0]), .sel(rest_ge)"
  - name: DmaChannel struct, the smaller offset taken, n crosses a beat (2026-11-20)
    edits:
      - file: rtl/lib/block/dma/dma_channel/struct/dma_channel.sv
        old: ".in0(dst_off), .in1(src_off), .sel(src_ge)"
        new: ".in0(src_off), .in1(dst_off), .sel(src_ge)"
