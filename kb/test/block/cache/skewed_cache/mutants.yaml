type: mutants
title: >-
  Mutants of exact uncached, no-cache and atomic requests and of CBOs (SkewedCache test,
  DirectCache, arbiter)
date: 2026-11-06
tests: [block_skewed_cache_behave]
mutants:
  - name: an uncached request with its line's address (offset 0), as before
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "assign mem_req_addr  = unc_pass   ? req_addr :"
        new: >-
          assign mem_req_addr  = unc_pass
          ? {req_addr[ADDR_WIDTH-1:SETS_OFFSET], {SETS_OFFSET{1'b0}}} :
    expect: caught
  - name: an uncached request with the line's size
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: >-
          assign mem_req_size  = unc_pass ? req_size :
          look_exact ? look_size : 3'(SETS_OFFSET);
        new: >-
          assign mem_req_size  = unc_pass ? 3'(SETS_OFFSET)
          : look_exact ? look_size : 3'(SETS_OFFSET);
    expect: caught
  - name: the size mux the wrong way round (struct)
    edits:
      - file: rtl/lib/block/cache/cache_control/struct/cache_control.sv
        old: "Mux2 #(3) u_mux2_mem_size(.in0(look_mem_size), .in1(req_size), .sel(unc_pass),"
        new: "Mux2 #(3) u_mux2_mem_size(.in0(req_size), .in1(look_mem_size), .sel(unc_pass),"
    tests: [block_direct_cache_struct]
    expect: caught
  - name: the arbiter sends the other side's size
    edits:
      - file: rtl/lib/block/cache/insn_data_cache_arbiter/behave/insn_data_cache_arbiter.sv
        old: "assign mem_req_size  = (side == SIDE_D) ? d_size : i_size;"
        new: "assign mem_req_size  = (side == SIDE_D) ? i_size : d_size;"
    tests: [block_insn_data_cache_arbiter_behave]
    expect: caught
  - name: the arbiter sends the other side's size (struct)
    edits:
      - file: rtl/lib/block/cache/insn_data_cache_arbiter/struct/insn_data_cache_arbiter.sv
        old: "Mux2 #(3) u_mux2_size(.in0(i_size), .in1(d_size), .sel(side), .out(mem_req_size));"
        new: "Mux2 #(3) u_mux2_size(.in0(d_size), .in1(i_size), .sel(side), .out(mem_req_size));"
    tests: [block_insn_data_cache_arbiter_struct]
    expect: caught
  - name: a no-cache load's answer fills its line
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "assign refill = answer && !wait_nocache;"
        new: "assign refill = answer && (!wait_nocache || 1'b1);"
    expect: caught
  - name: a no-cache request with its line's address
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "look_exact ? {look_line, look_offset}"
        new: "look_exact ? {look_line, look_offset & {SETS_OFFSET{1'b0}}}"
    expect: caught
  - name: a no-cache request with the line's size (struct)
    edits:
      - file: rtl/lib/block/cache/cache_control/struct/cache_control.sv
        old: ".in1(look_size), .sel(look_exact),"
        new: ".in1(look_size), .sel(1'b0),"
    tests: [block_skewed_cache_struct]
    expect: caught
  - name: a no-cache load's answer fills its line (struct)
    edits:
      - file: rtl/lib/block/cache/cache_control/struct/cache_control.sv
        old: ".en(served), .in(look_exact),"
        new: ".en(served), .in(1'b0),"
    tests: [block_skewed_cache_struct]
    expect: caught
  - name: an atomic may hit
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "assign load_hit  = look_ok && !look_we && hit && !look_atomic;"
        new: "assign load_hit  = look_ok && !look_we && hit;"
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "assign load_miss = look_ok && !look_we && (!hit || look_atomic);"
        new: "assign load_miss = look_ok && !look_we && !hit;"
    expect: caught
  - name: an atomic keeps the line it hits
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "(served && look_atomic && hit)"
        new: "(served && look_atomic && hit && 1'b0)"
    expect: caught
  - name: a request taken while an inval or flush is looked up (no bubble)
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "                                      !cbo_drop;"
        new: "                                      !(cbo_drop && 1'b0);"
    expect: caught
  - name: an inval or flush keeps the line it hits
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "(cbo_drop && hit && mem_req_ready)"
        new: "(cbo_drop && hit && mem_req_ready && 1'b0)"
    expect: caught
  - name: struct, a clean drops the line it hits too
    tests: [block_skewed_cache_struct]
    edits:
      - file: rtl/lib/block/cache/cache_control/struct/cache_control.sv
        old: "assign look_drops = look_cmo[1];"
        new: "assign look_drops = look_cmo[1] | look_cmo[0];"
    expect: caught
  - name: an atomic goes to memory as a plain load
    edits:
      - file: rtl/lib/block/cache/cache_control/behave/cache_control.sv
        old: "assign mem_req_atop  = unc_pass ? req_atop  : look_atop;"
        new: "assign mem_req_atop  = unc_pass ? req_atop  : ATOP_NONE;"
    expect: caught
  - name: an atomic that hits is neither a hit nor a miss (struct)
    edits:
      - file: rtl/lib/block/cache/cache_control/struct/cache_control.sv
        old: ".in2(look_atomic), .out(miss_cond)"
        new: ".in2(1'b0), .out(miss_cond)"
    tests: [block_skewed_cache_struct]
    expect: caught
  - name: the drop sets the valid bit (struct SkewedCache)
    edits:
      - file: rtl/lib/block/cache/skewed_cache/struct/skewed_cache.sv
        old: ".wr_en(valid_wr), .wr_set(look_index[w]), .wr_val(refill));"
        new: ".wr_en(valid_wr), .wr_set(look_index[w]), .wr_val(1'b1));"
    tests: [block_skewed_cache_struct]
    expect: caught
  - name: the arbiter sends the data cache's atop with an instruction read
    edits:
      - file: rtl/lib/block/cache/insn_data_cache_arbiter/behave/insn_data_cache_arbiter.sv
        old: "assign mem_req_atop  = (side == SIDE_D) ? d_atop : ATOP_NONE;"
        new: "assign mem_req_atop  = d_atop;"
    tests: [block_insn_data_cache_arbiter_behave]
    expect: caught
  - name: the atop mux of the arbiter the wrong way round (struct)
    edits:
      - file: rtl/lib/block/cache/insn_data_cache_arbiter/struct/insn_data_cache_arbiter.sv
        old: ".in0(AtomicPkg::ATOP_NONE), .in1(d_atop), .sel(side),"
        new: ".in0(d_atop), .in1(AtomicPkg::ATOP_NONE), .sel(side),"
    tests: [block_insn_data_cache_arbiter_struct]
    expect: caught
  - name: the arbiter sends the data cache's cmo with an instruction read
    edits:
      - file: rtl/lib/block/cache/insn_data_cache_arbiter/behave/insn_data_cache_arbiter.sv
        old: "assign mem_req_cmo   = (side == SIDE_D) ? d_cmo  : CMO_NONE;"
        new: "assign mem_req_cmo   = d_cmo;"
    tests: [block_insn_data_cache_arbiter_behave]
    expect: caught
  - name: the cmo mux of the arbiter the wrong way round (struct)
    edits:
      - file: rtl/lib/block/cache/insn_data_cache_arbiter/struct/insn_data_cache_arbiter.sv
        old: ".in0(CachePkg::CMO_NONE), .in1(d_cmo), .sel(side),"
        new: ".in0(d_cmo), .in1(CachePkg::CMO_NONE), .sel(side),"
    tests: [block_insn_data_cache_arbiter_struct]
    expect: caught
