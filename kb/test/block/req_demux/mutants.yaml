type: mutants
title: Mutants of the ReqDemux test (behave and struct versions)
date: 2026-11-06
tests: [block_req_demux_behave, block_req_demux_struct]
mutants:
  - name: behave, a request to another target does not wait for the answers
    edits:
      - file: rtl/lib/block/req_demux/behave/req_demux.sv
        old: "assign blocked   = (busy && other) || (req_rsp && need > SW'(MAX));"
        new: "assign blocked   = (busy && other && 1'b0) || (req_rsp && need > SW'(MAX));"
    expect: model
  - name: behave, a request that wants answers does not wait for room
    edits:
      - file: rtl/lib/block/req_demux/behave/req_demux.sv
        old: "assign blocked   = (busy && other) || (req_rsp && need > SW'(MAX));"
        new: "assign blocked   = (busy && other) || (req_rsp && need > SW'(MAX) && 1'b0);"
    expect: model
  - name: behave, the answer of the selected target, not the owner's
    edits:
      - file: rtl/lib/block/req_demux/behave/req_demux.sv
        old: "assign rsp_data  = answer_of(tgt_rsp_data, owner);"
        new: "assign rsp_data  = answer_of(tgt_rsp_data, req_sel);"
    expect: model
  - name: behave, a burst counted as one answer (2026-11-20)
    edits:
      - file: rtl/lib/block/req_demux/behave/req_demux.sv
        old: "pending <= pending + (ask_taken ? (PENDING_WIDTH+1)'(req_len) + 1'b1 : '0)"
        new: "pending <= pending + (ask_taken ? (PENDING_WIDTH+1)'(1) : '0)"
  - name: struct, an answer does not count down (2026-11-20, the adders)
    edits:
      - file: rtl/lib/block/req_demux/struct/req_demux.sv
        old: ".in2({PW{rsp_valid}}), .ci(1'b0)"
        new: ".in2({PW{rsp_valid & 1'b0}}), .ci(1'b0)"
    expect: model
  - name: struct, a blocked request still goes to its target
    edits:
      - file: rtl/lib/block/req_demux/struct/req_demux.sv
        old: ".in2({N_TARGETS{go}}),"
        new: ".in2({N_TARGETS{go | req_valid}}),"
    expect: model
