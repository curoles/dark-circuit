type: mutants
title: Mutants of MulRows
date: 2026-11-12
tests: [part_mul_rows]
mutants:
  - name: the correction rows complemented only in 2W bits (no ones above)
    edits:
      - file: rtl/lib/part/mul_rows.sv
        old: "        assign rows[W]     = {{(OUT - 2 * W){1'b1}}, x_inv, {W{1'b0}}};\n"
        new: "        assign rows[W]     = {{(OUT - 2 * W){1'b0}}, x_inv, {W{1'b0}}};\n"
    expect: caught
  - name: the constant 1 << W instead of 2 << W
    edits:
      - file: rtl/lib/part/mul_rows.sv
        old: "assign rows[W + 2] = OUT'(2) << W;"
        new: "assign rows[W + 2] = OUT'(1) << W;"
    expect: caught
  - name: the 1 << 2W of two negative operands dropped (Int32Mul's rows, too narrow here)
    edits:
      - file: rtl/lib/part/mul_rows.sv
        old: ".in1(a_neg), .in2(b_neg), .out(both_neg)"
        new: ".in1(a_neg), .in2(1'b0), .out(both_neg)"
    expect: caught
  - name: b's sign decided by a's top bit
    edits:
      - file: rtl/lib/part/mul_rows.sv
        old: ".in1(b_signed), .in2(b[W-1]), .out(b_neg)"
        new: ".in1(b_signed), .in2(a[W-1]), .out(b_neg)"
    expect: caught
