# Mig6's memory map, PMA-style (physical memory attributes, as the RISC-V privileged spec
# names them): every region with the properties hardware asks about, each by name, so no
# part decides by "is it I/O?".
#
# A region: name, base (a byte address, a multiple of size), size (bytes, a power of 2),
# desc, target and the attributes:
#   cacheable   the core's caches may hold it
#   io          accesses have side effects: never speculated, merged or repeated
#   atomics     AMOs allowed (an AtomicUnit at the target does them)
#   reservable  LR/SC allowed (a reservation works for it: the core's when cacheable,
#               the memory's exclusive monitor when not)
#   target      where a PE sends the access: local (its local memory), net (its network
#               interface: the shared memory), devices (none in Mig6 yet)
# Addresses in no region are an error (an access fault, later).

regions:
  - name: local
    base: 0x00000000
    size: 0x00010000        # 64 KiB
    desc: the PE's local memory, code and data, private to its core
    target: local
    cacheable: no           # a scratchpad on the core's data port (kb rtl/design/mig6/scratchpad)
    io: no
    atomics: no             # no AtomicUnit in front of it (Mig6Pe: a_lmem_plain)
    reservable: yes         # LR/SC: its exclusive monitor (Mig6Pe: u_local_monitor)

  - name: plic
    base: 0x0C000000
    size: 0x00400000        # 4 MiB: the spec's map up to context 0's claim register
    desc: "the PE's PLIC (rtl/lib/block/plic, sw/riscv/drivers/plic.h), one context: meip"
    target: devices         # the core's memory port to the PLIC's register port (Mig6Pe)
    cacheable: no
    io: yes
    atomics: no
    reservable: no

  - name: dma
    base: 0x0C420000        # Mig3's offset in its I/O region
    size: 0x00001000        # 4 KiB a channel: one channel (Mig6Pe: DMA_N)
    desc: "the PE's DMA's registers (DmaSifive: SiFive's PDMA map, sw/riscv/drivers/dma.h)"
    target: devices         # the core's memory port to the DMA's register port (Mig6Pe)
    cacheable: no
    io: yes
    atomics: no
    reservable: no

  - name: shared
    base: 0x80000000        # where RISC-V platforms put main memory
    size: 0x00100000        # 1 MiB: the shared RAM, no mirroring
    desc: the shared memory at the mesh's edge, one copy that all PEs share
    # Mig6Pe: a_no_net, until its network interface is wired
    target: net
    cacheable: no           # one copy, no coherence (README: ways to cache shared data)
    io: no
    atomics: yes            # the AtomicUnit in front of the shared RAM: the barrier
    reservable: yes         # LR/SC at the memory, its exclusive monitor (far: not cached)

# Generated files: template in this directory -> output relative to repository root.
generate:
  - { template: mig6_pma_pkg.sv.j2, output: rtl/design/mig6/mig6_pma_pkg.sv }
  - { template: mig6_pma.h.j2,      output: sw/riscv/mig6/mig6_pma.h }
  - { template: mig6.ld.j2,         output: sw/riscv/mig6/mig6.ld }
  - { template: mig6_pma.hpp.j2,    output: sw/riscv/mig6/mig6_pma.hpp }
