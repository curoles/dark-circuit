# Mig6 configuration. After a change run: make config
# The memory map (the local memory, the devices' region) is cfg/mig6_pma.yaml's.
rst_addr:        0x00000000   # PC after reset, byte address: the local memory's base
btb_index_width: 6            # BTB in IF: 1 << 6 = 64 entries (kb rtl/design/mig3/btb_size)
btb_tag_width:   8            # BTB tag: index + tag = 14 bits, the word address of 64 KiB
ras_addr_width:  3            # return-address stack in ID: 1 << 3 = 8 entries
icache_sets_width: 6          # I-cache: skewed, 2 ways of 1 << 6 = 64 lines
dcache_sets_width: 6          # D-cache: skewed, write-through, 2 ways of 64 lines
cache_line_words: 2           # words in a line of both caches and of the memory: 1 or 2
plic_prio_width: 2            # each PE's PLIC: priorities 1 to 3 (0: never)
dma_source:      1            # its sources: DMA channel c's done at 1 + 2c, its error 2 + 2c
dma_depth:       8            # each PE's DMA: transactions in flight (kb rtl/design/mig6/dma_depth)
dma_max_burst:   8            # ... read bursts, 1 (none) to 16 words (kb rtl/design/mig6/bursts)
noc_buf_depth:   8            # router input buffers, flits a VC (kb rtl/design/mig6/noc_buffers)

# Generated files: template in this directory -> output relative to repository root.
generate:
  - { template: mig6_config_pkg.sv.j2, output: rtl/design/mig6/mig6_config_pkg.sv }
  - { template: mig6_config.h.j2,      output: sw/riscv/mig6/mig6_config.h }
